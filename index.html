<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preswylfa Dining</title>

  <link rel="icon" type="image/png" href="preswylfa-icon.png">
  <link rel="apple-touch-icon" href="preswylfa-icon.png">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Preswylfa Dining">
  <meta name="application-name" content="Preswylfa Dining">
  <meta name="theme-color" content="#123a66">

  <style>
    :root {
      --blue:#123a66;
      --blue-dark:#0d2d50;
      --gold:#d79a2b;
      --cream:#f7f3ea;
      --ink:#1f2a33;
      --muted:#6b7280;
    }
    * { box-sizing:border-box; }
    html,body {
      margin:0;
      min-height:100%;
      background:#eef2f6;
      font-family:Arial,Helvetica,sans-serif;
      color:var(--ink);
    }
    body {
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }
    .card {
      width:100%;
      max-width:460px;
      background:#fff;
      border-radius:18px;
      overflow:hidden;
      box-shadow:0 10px 30px rgba(0,0,0,.08);
      text-align:center;
    }
    .top {
      background:linear-gradient(135deg,var(--blue-dark),var(--blue));
      border-bottom:5px solid var(--gold);
      padding:28px 22px 24px;
      color:#fff;
    }
    .logo {
      width:118px;
      height:118px;
      border-radius:24px;
      object-fit:cover;
      background:#fff;
      margin-bottom:16px;
    }
    h1 {
      margin:0;
      font-size:30px;
    }
    .content {
      padding:26px 24px 30px;
    }
    p {
      margin:0 0 22px;
      color:var(--muted);
      line-height:1.5;
      font-size:16px;
    }
    .btn {
      display:inline-block;
      width:100%;
      background:var(--blue);
      color:#fff;
      text-decoration:none;
      padding:14px 18px;
      border-radius:10px;
      font-weight:700;
      font-size:17px;
    }
    .hint {
      margin-top:18px;
      font-size:13px;
      color:var(--muted);
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="top">
      <img class="logo" src="preswylfa-icon.png" alt="Preswylfa Dining">
      <h1>Preswylfa Dining</h1>
    </div>
    <div class="content">
      <p>Tap below to open the current Preswylfa Lodge dining booking app.</p>
      <a class="btn" href="https://script.google.com/macros/s/AKfycbzQ4mrQh_gFrlMx9Z3p-_hKuuAkHc2GY1cqS-0svehMKoqg4LrQmsrnZ92h-fA15D64VQ/exec">Open Preswylfa Dining</a>
      <div class="hint">To install the logo on iPhone, add this page to your Home Screen before opening the dining app.</div>
    </div>
  </main>
</body>
</html>
