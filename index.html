<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preswylfa Dining</title>
  <link rel="icon" type="image/png" href="preswylfa-icon.png">
  <link rel="apple-touch-icon" href="preswylfa-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Preswylfa Dining">
  <meta name="application-name" content="Preswylfa Dining">
  <meta name="theme-color" content="#123a66">
  <style>
    html,body{margin:0;padding:0;width:100%;height:100%;background:#fff;font-family:Arial,Helvetica,sans-serif}
    .wrap{display:flex;align-items:center;justify-content:center;min-height:100%;text-align:center;padding:24px;box-sizing:border-box}
    .card{max-width:520px}
    img{width:120px;height:120px;border-radius:24px;object-fit:cover;margin-bottom:18px}
    h1{margin:0 0 10px;color:#123a66;font-size:28px}
    p{margin:0 0 18px;color:#4b5563;line-height:1.5}
    a{display:inline-block;background:#123a66;color:#fff;text-decoration:none;padding:12px 18px;border-radius:9px;font-weight:700}
  </style>
  <script>
    const APP_URL = "PASTE_YOUR_CURRENT_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE";
    window.addEventListener("load", function () {
      if (!APP_URL.includes("PASTE_YOUR_CURRENT")) {
        window.location.replace(APP_URL);
      }
    });
  </script>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <img src="preswylfa-icon.png" alt="Preswylfa Dining">
      <h1>Preswylfa Dining</h1>
      <p>Opening the dining app…</p>
      <a href="PASTE_YOUR_CURRENT_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE">Open Preswylfa Dining</a>
    </div>
  </div>
</body>
</html>
